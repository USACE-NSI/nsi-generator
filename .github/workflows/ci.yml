name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Inject the org PAT directly into the GitHub Packages NuGet source.
      # This authenticates every request (index.json + /download/... + /query/...)
      # and is more reliable than relying on setup-dotnet's NUGET_AUTH_TOKEN.
      - name: Authenticate to GitHub Packages
        shell: bash
        env:
          USACE_NSI_TOKEN: ${{ secrets.USACE_NSI_TOKEN }}
        run: |
          dotnet nuget update source github \
            --configfile nuget.config \
            --username "USACE_NSI_TOKEN" \
            --password "$USACE_NSI_TOKEN" \
            --store-password-in-clear-text

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'